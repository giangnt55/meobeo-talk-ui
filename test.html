    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Lấy các phần tử DOM
            const contentTextarea = document.getElementById('contentTextarea');
            const titleInput = document.getElementById('titleInput');
            const boldButton = document.getElementById('boldButton');
            const italicButton = document.getElementById('italicButton');
            const underlineButton = document.getElementById('underlineButton');
            const listButton = document.getElementById('listButton');
            const photoButton = document.getElementById('photoButton');
            const emojiButton = document.getElementById('emojiButton');
            const noteButton = document.getElementById('noteButton');
            const drawButton = document.getElementById('drawButton');
            const saveButton = document.getElementById('saveButton');
            const draftButton = document.getElementById('draftButton');
            const moodInput = document.getElementById('moodInput');
            const addMoodButton = document.getElementById('addMoodButton');
            const moodTags = document.getElementById('moodTags');
            const datePicker = document.getElementById('datePicker');
            const visibilityButtons = document.querySelectorAll('.visibility-button');

            // Biến lưu trạng thái định dạng
            let isBold = false;
            let isItalic = false;
            let isUnderline = false;
            let isList = false;

            // Hàm thực hiện định dạng văn bản
            function formatText(format) {
                const textarea = contentTextarea;
                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;
                const selectedText = textarea.value.substring(start, end);
                
                let formattedText = '';
                let newCursorPos = 0;
                
                switch(format) {
                    case 'bold':
                        formattedText = `**${selectedText}**`;
                        newCursorPos = start + 2;
                        isBold = !isBold;
                        boldButton.classList.toggle('active', isBold);
                        break;
                    case 'italic':
                        formattedText = `*${selectedText}*`;
                        newCursorPos = start + 1;
                        isItalic = !isItalic;
                        italicButton.classList.toggle('active', isItalic);
                        break;
                    case 'underline':
                        formattedText = `__${selectedText}__`;
                        newCursorPos = start + 2;
                        isUnderline = !isUnderline;
                        underlineButton.classList.toggle('active', isUnderline);
                        break;
                    case 'list':
                        if (selectedText.includes('\n')) {
                            const lines = selectedText.split('\n');
                            formattedText = lines.map(line => `- ${line}`).join('\n');
                        } else {
                            formattedText = `- ${selectedText}`;
                        }
                        newCursorPos = start + 2;
                        isList = !isList;
                        listButton.classList.toggle('active', isList);
                        break;
                }
                
                // Thay thế văn bản đã chọn bằng văn bản đã định dạng
                textarea.value = textarea.value.substring(0, start) + 
                               formattedText + 
                               textarea.value.substring(end);
                
                // Đặt lại vị trí con trỏ
                textarea.focus();
                textarea.setSelectionRange(newCursorPos, newCursorPos + selectedText.length);
                
                // Kích hoạt sự kiện input để cập nhật giao diện
                textarea.dispatchEvent(new Event('input'));
            }

            // Hàm chèn văn bản vào vị trí con trỏ
            function insertTextAtCursor(text) {
                const textarea = contentTextarea;
                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;
                
                textarea.value = textarea.value.substring(0, start) + 
                               text + 
                               textarea.value.substring(end);
                
                // Đặt lại vị trí con trỏ sau văn bản vừa chèn
                textarea.focus();
                textarea.setSelectionRange(start + text.length, start + text.length);
                
                // Kích hoạt sự kiện input
                textarea.dispatchEvent(new Event('input'));
            }

            // Hàm xử lý thêm ảnh
            function handleAddPhoto() {
                const imageUrl = prompt('Nhập URL của ảnh:', 'https://example.com/image.jpg');
                if (imageUrl) {
                    insertTextAtCursor(`\n![Mô tả ảnh](${imageUrl})\n`);
                }
            }

            // Hàm xử lý thêm emoji
            function handleAddEmoji() {
                const emojis = ['😊', '😂', '🥰', '😎', '🤩', '😍', '👍', '🎉', '✨', '🌟'];
                let emojiList = 'Chọn một emoji:\n\n';
                emojis.forEach((emoji, index) => {
                    emojiList += `${index + 1}. ${emoji}\n`;
                });
                
                const choice = prompt(emojiList + '\nNhập số thứ tự (1-10):');
                const index = parseInt(choice) - 1;
                
                if (index >= 0 && index < emojis.length) {
                    insertTextAtCursor(emojis[index]);
                }
            }

            // Hàm xử lý thêm ghi chú
            function handleAddNote() {
                insertTextAtCursor('\n> Ghi chú của bạn ở đây...\n');
            }

            // Hàm xử lý vẽ
            function handleDraw() {
                alert('Tính năng vẽ sẽ được mở trong một cửa sổ mới. (Chức năng demo)');
            }

            // Hàm lưu bài viết
            function saveMemory(isDraft = false) {
                const title = titleInput.value.trim();
                const content = contentTextarea.value.trim();
                const date = datePicker.value;
                const visibility = document.querySelector('.visibility-button.bg-primary/10')?.dataset.visibility || 'public';
                
                const selectedMoods = Array.from(document.querySelectorAll('.mood-tag.bg-primary/20'))
                    .map(tag => tag.dataset.mood);
                
                if (!title && !isDraft) {
                    alert('Vui lòng nhập tiêu đề cho bài viết!');
                    titleInput.focus();
                    return;
                }
                
                if (!content && !isDraft) {
                    alert('Vui lòng nhập nội dung cho bài viết!');
                    contentTextarea.focus();
                    return;
                }
                
                const memoryData = {
                    title,
                    content,
                    date,
                    visibility,
                    moods: selectedMoods,
                    isDraft,
                    createdAt: new Date().toISOString()
                };
                
                console.log('Dữ liệu bài viết:', memoryData);
                
                // Hiển thị thông báo
                alert(isDraft ? 'Bài viết đã được lưu nháp!' : 'Bài viết đã được lưu thành công!');
                
                // Reset form (tùy chọn)
                if (!isDraft) {
                    titleInput.value = '';
                    contentTextarea.value = '';
                    // Reset các nút định dạng
                    document.querySelectorAll('.toolbar-button').forEach(btn => btn.classList.remove('active'));
                    isBold = isItalic = isUnderline = isList = false;
                }
            }

            // Hàm thêm mood tag
            function addMoodTag() {
                const moodText = moodInput.value.trim();
                if (!moodText) return;
                
                // Tạo một ID duy nhất cho mood tag
                const moodId = moodText.toLowerCase().replace(/\s+/g, '-');
                
                // Màu sắc ngẫu nhiên cho mood tag
                const colors = [
                    'bg-sky-100 dark:bg-sky-500/20 text-sky-800 dark:text-sky-200',
                    'bg-amber-100 dark:bg-amber-500/20 text-amber-800 dark:text-amber-200',
                    'bg-indigo-100 dark:bg-indigo-500/20 text-indigo-800 dark:text-indigo-200',
                    'bg-rose-100 dark:bg-rose-500/20 text-rose-800 dark:text-rose-200',
                    'bg-emerald-100 dark:bg-emerald-500/20 text-emerald-800 dark:text-emerald-200',
                    'bg-purple-100 dark:bg-purple-500/20 text-purple-800 dark:text-purple-200'
                ];
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                
                // Tạo element mood tag mới
                const newMoodTag = document.createElement('span');
                newMoodTag.className = `mood-tag px-3 py-1.5 ${randomColor} rounded-full text-xs font-medium cursor-pointer hover:opacity-80`;
                newMoodTag.dataset.mood = moodId;
                newMoodTag.textContent = moodText;
                
                // Thêm sự kiện click để chọn/bỏ chọn
                newMoodTag.addEventListener('click', function() {
                    this.classList.toggle('bg-primary/20');
                    this.classList.toggle('text-primary');
                    const baseColor = this.className.match(/bg-(\w+)-100/);
                    if (baseColor && !this.classList.contains('bg-primary/20')) {
                        this.className = this.className.replace(/bg-\w+-\d+ dark:bg-\w+-\d+\/\d+ text-\w+-\d+ dark:text-\w+-\d+/, 
                            randomColor);
                    }
                });
                
                // Thêm vào container
                moodTags.appendChild(newMoodTag);
                
                // Xóa nội dung input
                moodInput.value = '';
            }

            // Sự kiện cho các nút định dạng
            boldButton.addEventListener('click', () => formatText('bold'));
            italicButton.addEventListener('click', () => formatText('italic'));
            underlineButton.addEventListener('click', () => formatText('underline'));
            listButton.addEventListener('click', () => formatText('list'));
            
            // Sự kiện cho các nút chức năng khác
            photoButton.addEventListener('click', handleAddPhoto);
            emojiButton.addEventListener('click', handleAddEmoji);
            noteButton.addEventListener('click', handleAddNote);
            drawButton.addEventListener('click', handleDraw);
            
            // Sự kiện cho nút lưu
            saveButton.addEventListener('click', () => saveMemory(false));
            draftButton.addEventListener('click', () => saveMemory(true));
            
            // Sự kiện cho mood tags
            document.querySelectorAll('.mood-tag').forEach(tag => {
                tag.addEventListener('click', function() {
                    this.classList.toggle('bg-primary/20');
                    this.classList.toggle('text-primary');
                    
                    // Lưu màu gốc để có thể khôi phục
                    if (!this.dataset.originalClass) {
                        this.dataset.originalClass = this.className;
                    }
                });
            });
            
            // Sự kiện thêm mood tag mới
            addMoodButton.addEventListener('click', addMoodTag);
            moodInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    addMoodTag();
                }
            });
            
            // Sự kiện cho visibility buttons
            visibilityButtons.forEach(button => {
                button.addEventListener('click', function() {
                    // Xóa active state từ tất cả các nút
                    visibilityButtons.forEach(btn => {
                        btn.classList.remove('bg-primary/10', 'dark:bg-primary/20', 'text-slate-800', 'dark:text-white');
                        btn.classList.add('hover:bg-slate-500/10', 'dark:hover:bg-slate-500/20', 'text-slate-600', 'dark:text-slate-300');
                        
                        // Reset icon color
                        const icon = btn.querySelector('.material-symbols-outlined');
                        if (icon) {
                            icon.classList.remove('text-primary');
                        }
                    });
                    
                    // Thêm active state cho nút được click
                    this.classList.remove('hover:bg-slate-500/10', 'dark:hover:bg-slate-500/20', 'text-slate-600', 'dark:text-slate-300');
                    this.classList.add('bg-primary/10', 'dark:bg-primary/20', 'text-slate-800', 'dark:text-white');
                    
                    // Đổi màu icon
                    const icon = this.querySelector('.material-symbols-outlined');
                    if (icon) {
                        icon.classList.add('text-primary');
                    }
                });
            });

            // Khởi tạo visibility mặc định là Public
            document.querySelector('[data-visibility="public"]').click();

            // Theo dõi sự kiện input để cập nhật trạng thái nút
            contentTextarea.addEventListener('input', function() {
                // Có thể thêm logic highlight cú pháp Markdown ở đây
                console.log('Nội dung đã thay đổi:', this.value.length, 'ký tự');
            });

            // Thêm phím tắt cho định dạng
            document.addEventListener('keydown', function(e) {
                // Ctrl+B cho in đậm
                if (e.ctrlKey && e.key === 'b') {
                    e.preventDefault();
                    formatText('bold');
                }
                // Ctrl+I cho in nghiêng
                if (e.ctrlKey && e.key === 'i') {
                    e.preventDefault();
                    formatText('italic');
                }
                // Ctrl+U cho gạch chân
                if (e.ctrlKey && e.key === 'u') {
                    e.preventDefault();
                    formatText('underline');
                }
            });
        });
    </script>
</body>
</html>
